[package]
name = "fullfat-audio"
version = "0.1.0"
edition = "2021"
authors = ["The gbakit Authors"]
description = "Clean-room no_std parser, software synthesizers, sequence decoder, WAV16 exporter, and SF2 builder for the Full Fat GBA Mono DirectSound audio engine"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jidoughost-tl/fullfat-audio-rs"
keywords = ["gba", "audio", "synthesizer", "soundfont", "emulator"]
categories = ["multimedia::audio", "emulators", "no-std"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]

[dev-dependencies]

[[bench]]
name = "bench_audio"
harness = false
